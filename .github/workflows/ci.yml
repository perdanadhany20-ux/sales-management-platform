# Hak Cipta © 2026 DWP. Seluruh hak dilindungi.
# CI: setiap push & pull request diperiksa sebelum Vercel men-deploy.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aplikasi:
    name: Typecheck · Unit test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: SETUP_LENGKAP.sql sesuai migrasi
        run: |
          npm run sql:setup
          git diff --exit-code supabase/SETUP_LENGKAP.sql || { echo "::error::Jalankan 'npm run sql:setup' lalu commit SETUP_LENGKAP.sql"; exit 1; }
      - name: Build
        run: npm run build
        env:
          # Nilai tiruan — build tidak menghubungi layanan apa pun.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Migrasi + uji keamanan SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/uji-sql.sh

  android:
    name: APK rilis bisa dibangun & bertanda tangan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
      # Langkah yang sama dengan apk.yml, tetapi dengan keystore & kunci tanda
      # tangan sekali pakai — membuktikan APK pelanggan bisa dibangun tanpa
      # menyentuh rahasia siapa pun. APK-nya tidak diunggah ke mana pun.
      - name: Konfigurasi uji
        run: |
          ks="$RUNNER_TEMP/uji.jks"
          keytool -genkeypair -keystore "$ks" -storepass ujiuji123 -keypass ujiuji123 -alias sales \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=CI
          {
            echo "url=https://ci.example.com"
            echo "applicationId=com.salesmanagement.ci"
            echo "namaAplikasi=Sales CI"
            echo "kunciTanda=$(openssl rand -hex 32)"
            echo "keystore=$ks"
            echo "keyAlias=sales"
            echo "keystorePassword=ujiuji123"
            echo "versionCode=9"
            echo "versionName=9.9.9"
          } > android/pelanggan.properties
      - name: Bangun APK rilis
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Periksa tanda tangan & versi
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --print-certs "$apk" | head -3
          "$bt/aapt2" dump badging "$apk" | head -1
          "$bt/aapt2" dump badging "$apk" | grep -q "versionName='9.9.9'"
          ls -la "$apk"
          rm -f android/pelanggan.properties "$RUNNER_TEMP/uji.jks"
