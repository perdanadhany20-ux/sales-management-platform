# Hak Cipta © 2026 DWP. Seluruh hak dilindungi.
# Bangun APK satu pelanggan lalu unggah langsung ke Storage Supabase-nya.
#
# Jalankan: GitHub → Actions → "APK pelanggan" → Run workflow → isi kode
# pelanggan (mis. WMPUTU) dan versinya.
#
# Rahasia per pelanggan (Settings → Secrets and variables → Actions), dengan
# <KODE> = kode yang diisi saat menjalankan:
#   APK_<KODE>_PROPERTIES     isi pelanggan.properties TANPA baris keystore=
#                             (url, applicationId, namaAplikasi, kunciTanda,
#                             keyAlias, keystorePassword)
#   APK_<KODE>_KEYSTORE_B64   keystore .jks dalam base64 (base64 -w0 sales.jks)
#   APK_<KODE>_SUPABASE_URL   https://xxxx.supabase.co milik pelanggan
#   APK_<KODE>_SERVICE_KEY    service_role key Supabase pelanggan
#
# Repo ini publik: APK TIDAK diunggah sebagai artifact (bisa diunduh siapa
# saja, dan APK memuat kunci tanda tangan lokasi). Hasilnya hanya masuk ke
# bucket privat `aplikasi` pelanggan → Profil → Aplikasi Android.
name: APK pelanggan

on:
  workflow_dispatch:
    inputs:
      kode:
        description: Kode pelanggan (huruf besar/angka, sesuai nama secret)
        required: true
      versionName:
        description: Versi (mis. 1.3.0)
        required: true
      versionCode:
        description: versionCode (angka, harus lebih besar dari APK sebelumnya)
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: apk
    steps:
      - name: Periksa masukan
        env:
          KODE: ${{ inputs.kode }}
          VNAME: ${{ inputs.versionName }}
          VCODE: ${{ inputs.versionCode }}
        run: |
          [[ "$KODE" =~ ^[A-Z0-9_]{2,30}$ ]] || { echo "::error::Kode pelanggan tidak sah"; exit 1; }
          [[ "$VNAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versionName harus x.y.z"; exit 1; }
          [[ "$VCODE" =~ ^[0-9]{1,6}$ ]] || { echo "::error::versionCode harus angka"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Tulis konfigurasi pelanggan
        env:
          PROPS: ${{ secrets[format('APK_{0}_PROPERTIES', inputs.kode)] }}
          KS: ${{ secrets[format('APK_{0}_KEYSTORE_B64', inputs.kode)] }}
          VNAME: ${{ inputs.versionName }}
          VCODE: ${{ inputs.versionCode }}
        run: |
          [ -n "$PROPS" ] && [ -n "$KS" ] || { echo "::error::Secret APK_${{ inputs.kode }}_PROPERTIES / _KEYSTORE_B64 belum diisi"; exit 1; }
          ks="$RUNNER_TEMP/rilis.jks"
          echo "$KS" | base64 -d > "$ks"
          {
            printf '%s\n' "$PROPS" | grep -vE '^(keystore|versionCode|versionName)='
            echo "keystore=$ks"
            echo "versionCode=$VCODE"
            echo "versionName=$VNAME"
          } > android/pelanggan.properties

      - name: Bangun APK rilis
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Unggah ke Storage pelanggan (bucket privat "aplikasi")
        env:
          URL: ${{ secrets[format('APK_{0}_SUPABASE_URL', inputs.kode)] }}
          KEY: ${{ secrets[format('APK_{0}_SERVICE_KEY', inputs.kode)] }}
        run: |
          [ -n "$URL" ] && [ -n "$KEY" ] || { echo "::error::Secret APK_${{ inputs.kode }}_SUPABASE_URL / _SERVICE_KEY belum diisi"; exit 1; }
          apk=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::APK bertanda tangan tidak ditemukan (keystore salah?)"; exit 1; }
          kode=$(curl -sS -o /tmp/hasil.txt -w '%{http_code}' -X POST \
            "${URL%/}/storage/v1/object/aplikasi/sales-management.apk" \
            -H "Authorization: Bearer $KEY" -H "apikey: $KEY" \
            -H "x-upsert: true" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$apk")
          [ "$kode" = 200 ] || { echo "::error::Unggah gagal ($kode)"; cat /tmp/hasil.txt; exit 1; }
          echo "### ✅ APK ${{ inputs.versionName }} (${{ inputs.versionCode }}) terunggah untuk ${{ inputs.kode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pengguna mengunduh ulang lewat Profil → Aplikasi Android." >> "$GITHUB_STEP_SUMMARY"

      - name: Bersihkan rahasia
        if: always()
        run: rm -f android/pelanggan.properties "$RUNNER_TEMP/rilis.jks"
